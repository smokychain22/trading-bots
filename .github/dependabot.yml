version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # major upgrades are deliberate, focused changes with their own regression run (see docs/operations/THETA_PHASE4_SECURITY_REVIEW_20261003.md)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
