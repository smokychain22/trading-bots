name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trading_bots
          POSTGRES_USER: trading_bots
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_bots -d trading_bots"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run scan:security
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      - run: python -m unittest discover -s bots/theta/tests/quant -p 'test_*.py'
      - name: Apply migrations and test schema invariants
        run: |
          for migration in migrations/*.sql; do
            psql -h 127.0.0.1 -U trading_bots -d trading_bots -v ON_ERROR_STOP=1 -f "$migration"
          done
          for test_file in tests/sql/*.sql; do
            psql -h 127.0.0.1 -U trading_bots -d trading_bots -v ON_ERROR_STOP=1 -f "$test_file"
          done
          python - <<'PY'
          import socket

          with socket.create_connection(("127.0.0.1", 6379), timeout=3) as client:
              client.sendall(b"*1\r\n$4\r\nPING\r\n")
              assert client.recv(64) == b"+PONG\r\n"
          PY
      - name: Test real customer persistence in disposable PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://trading_bots:ci-only-password@127.0.0.1:5432/trading_bots
        run: npx tsx --test tests/db/customer-persistence.test.ts
