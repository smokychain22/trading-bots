name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trading_bots
          POSTGRES_USER: trading_bots
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_bots -d trading_bots"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "duckdb>=1.4,<2"
      - name: Bind real Python orchestration tests to the configured interpreter
        run: echo "PYTHON_EXECUTABLE_FOR_TESTS=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test -- --evidence=.ci-test-evidence/node-suite.jsonl
      - run: npm run build
      - run: npm run scan:security
      - run: npm run storage:git-policy
      - name: Test Windows backup safety and bounded digest contracts
        shell: pwsh
        run: |
          ./tests/windows/theta-backup-readonly-guard.test.ps1
          ./tests/windows/theta-backup-digest-v2.test.ps1
          ./tests/windows/theta-postgres-tool-deadline.test.ps1
          ./tests/windows/theta-bounded-process.test.ps1
          ./tests/windows/theta-marks-tick.test.ps1
          ./tests/windows/theta-snapshot-heartbeat.test.ps1
          ./tests/windows/theta-sequence-parity.test.ps1
          ./tests/windows/theta-process-quoting.test.ps1
          ./tests/windows/theta-phase1-runtime-regressions.test.ps1
          ./tests/windows/theta-data-platform-tasks.test.ps1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      - run: python -m unittest discover -s bots/theta/tests/quant -p 'test_*.py'
      - name: Prove locked worker fails closed on schema 064
        env:
          THETA_SCHEMA064_TEST_DATABASE_URL: postgresql://trading_bots:ci-only-password@127.0.0.1:5432/theta_schema064_ci
        run: |
          createdb -h 127.0.0.1 -U trading_bots theta_schema064_ci
          for migration in migrations/*.sql; do
            number=${migration##*/}
            number=${number%%_*}
            if ((10#$number > 64)); then break; fi
            psql -h 127.0.0.1 -U trading_bots -d theta_schema064_ci -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          for invariant in tests/sql/*.sql; do
            number=${invariant##*/}
            number=${number%%_*}
            if ((10#$number > 64)); then break; fi
            psql -h 127.0.0.1 -U trading_bots -d theta_schema064_ci -v ON_ERROR_STOP=1 -f "$invariant" >/dev/null
          done
          npx tsx --test tests/db/schema-064-locked-worker.integration.test.ts
      - name: Apply migrations and test schema invariants
        run: |
          for migration in migrations/*.sql; do
            psql -h 127.0.0.1 -U trading_bots -d trading_bots -v ON_ERROR_STOP=1 -f "$migration"
          done
          for test_file in tests/sql/*.sql; do
            psql -h 127.0.0.1 -U trading_bots -d trading_bots -v ON_ERROR_STOP=1 -f "$test_file"
          done
          python - <<'PY'
          import socket

          with socket.create_connection(("127.0.0.1", 6379), timeout=3) as client:
              client.sendall(b"*1\r\n$4\r\nPING\r\n")
              assert client.recv(64) == b"+PONG\r\n"
          PY
      - name: Test real customer persistence in disposable PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://trading_bots:ci-only-password@127.0.0.1:5432/trading_bots
        run: |
          mkdir -p .ci-test-evidence
          git rev-parse HEAD > .ci-test-evidence/source-sha.txt
          npx tsx --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tools/theta-test-evidence-reporter.mjs --test-reporter-destination=.ci-test-evidence/disposable-persistence.jsonl tests/db/*.test.ts
      - name: Prove runtime fault containment in a dedicated disposable PostgreSQL database
        env:
          THETA_RUNTIME_FAULT_DATABASE_URL: postgresql://trading_bots:ci-only-password@127.0.0.1:5432/theta_runtime_fault_ci
        run: |
          createdb -h 127.0.0.1 -U trading_bots theta_runtime_fault_ci
          npx tsx --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tools/theta-test-evidence-reporter.mjs --test-reporter-destination=.ci-test-evidence/disposable-faults.jsonl tests/db/runtime-postgres-faults.test.ts
      - name: Test accepted-canary autonomous Paper transition in a dedicated disposable PostgreSQL database
        env:
          TEST_DATABASE_URL: postgresql://trading_bots:ci-only-password@127.0.0.1:5432/theta_autonomous_transition_ci
        run: |
          createdb -h 127.0.0.1 -U trading_bots theta_autonomous_transition_ci
          for migration in migrations/*.sql; do
            psql -h 127.0.0.1 -U trading_bots -d theta_autonomous_transition_ci -v ON_ERROR_STOP=1 -q -f "$migration" >/dev/null
          done
          npx tsx --test --test-concurrency=1 tests/db/autonomous-paper-transition.test.ts
      - name: Test the data platform (partition retirement, archive, resolver, automation entry point) in a dedicated disposable PostgreSQL database
        env:
          THETA_DATA_PLATFORM_DATABASE_URL: postgresql://trading_bots:ci-only-password@127.0.0.1:5432/theta_dp_ci
        run: |
          createdb -h 127.0.0.1 -U trading_bots theta_dp_ci
          npx tsx --test --test-concurrency=1 --test-reporter=spec tests/db/data-platform-postgres.test.ts tests/db/data-platform-cli.test.ts tests/db/data-platform-automation.test.ts tests/db/data-platform-rebuild.test.ts tests/db/data-platform-pit-view.test.ts
      - name: Test the normalized point-in-time writer, cycle blob lifecycle, compatibility swap and draft DP1 on the production schema (all migrations)
        env:
          THETA_DATA_PLATFORM_FULL_DATABASE_URL: postgresql://trading_bots:ci-only-password@127.0.0.1:5432/theta_dp_full_ci
        run: |
          createdb -h 127.0.0.1 -U trading_bots theta_dp_full_ci
          for migration in migrations/*.sql; do
            psql -h 127.0.0.1 -U trading_bots -d theta_dp_full_ci -v ON_ERROR_STOP=1 -q -f "$migration" >/dev/null
          done
          npx tsx --test --test-concurrency=1 --test-reporter=spec tests/db/data-platform-pit.test.ts tests/db/data-platform-lifecycle.test.ts
      - name: Prove operational truth is unaffected by a STORAGE_CRITICAL pressure state (draft DP1 applied, governor enabled)
        env:
          TEST_DATABASE_URL: postgresql://trading_bots:ci-only-password@127.0.0.1:5432/theta_phase2_recovery_ci
          THETA_STORAGE_GOVERNOR: '1'
          THETA_PIT_STORAGE_MODE: SHADOW
        run: |
          createdb -h 127.0.0.1 -U trading_bots theta_phase2_recovery_ci
          for migration in migrations/*.sql; do
            psql -h 127.0.0.1 -U trading_bots -d theta_phase2_recovery_ci -v ON_ERROR_STOP=1 -q -f "$migration" >/dev/null
          done
          psql -h 127.0.0.1 -U trading_bots -d theta_phase2_recovery_ci -v ON_ERROR_STOP=1 -q -f docs/proposals/DP1_data_platform_DRAFT.sql >/dev/null
          psql -h 127.0.0.1 -U trading_bots -d theta_phase2_recovery_ci -v ON_ERROR_STOP=1 -q -c "INSERT INTO dp.storage_pressure_state(singleton, band, database_bytes, plan_bytes, archive_queue_bytes, archive_lag_sessions, archive_backend_healthy, projected_sessions_to_critical, evaluated_at) VALUES (true, 'STORAGE_CRITICAL', 7700000000, 8589934592, 3000000000, 9, false, 0, now())"
          npx tsx --test --test-concurrency=1 --test-reporter=spec $(ls tests/db/*.test.ts | grep -v 'data-platform-' | grep -v 'phase3-' | grep -v 'runtime-postgres-faults' | grep -v 'autonomous-paper-transition' | grep -v 'schema-064')
      - name: Scan generated evidence and test output for secrets before it is uploaded
        if: always()
        run: node tools/security-scan.mjs --extra=.ci-test-evidence --extra=test-results --extra=playwright-report
      - name: Preserve sanitized disposable-database executed test identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-database-test-evidence
          path: .ci-test-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
